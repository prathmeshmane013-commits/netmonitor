spring.application.name=netmonitor-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/netmonitor
spring.datasource.username=netmonitor
spring.datasource.password=netmonitor
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (override with an env var in real deployments, never hardcode in prod)
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-min-32-chars}
app.jwt.expiration-ms=3600000

# Mail (for alert emails) - fill in with real SMTP creds or an SES/SMTP relay
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=8080
